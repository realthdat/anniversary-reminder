<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anniversaries</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #1e293b;
    --muted: #475569;
    --line: #e2e8f0;
    --action: #2563eb;
    --button: #2563eb;
    --delete: #b91c1c;
    --track: #cbd5e1;
    --stage: #e8edf2;
  }
  html[data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --ink: #f8fafc;
    --muted: #94a3b8;
    --line: #334155;
    --action: #93c5fd;
    --button: #2563eb;
    --delete: #fca5a5;
    --track: #475569;
    --stage: #020617;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--stage);
    color: var(--ink);
    font-family: "Segoe UI", sans-serif;
  }
  .stage { display: flex; justify-content: center; padding: 24px 16px; }
  .group h3 { margin: 16px 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .group.first h3 { margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; }
  .hair { height: 1px; background: var(--line); }
  .langrow {
    display: flex; align-items: center; width: 100%; min-height: 48px; padding: 0; border: 0; background: transparent;
    color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer;
  }
  .langrow.on { color: var(--action); }
  .phone {
    width: min(390px, 100%);
    min-height: 720px;
    background: var(--bg);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .status { display: flex; justify-content: space-between; padding: 14px 22px 0; font-size: 13px; font-weight: 600; }
  .screen { padding: 8px 20px 20px; display: flex; flex-direction: column; flex: 1; overflow-y: auto; }
  .bar { display: flex; align-items: center; min-height: 56px; gap: 4px; }
  .bar h2 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; }
  .icon {
    width: 48px; height: 48px; border: 0; background: transparent; color: var(--ink);
    border-radius: 24px; display: grid; place-items: center; padding: 0; cursor: pointer;
  }
  .icon svg { width: 24px; height: 24px; }
  .hero, .row-card, .date-row {
    background: var(--card);
    border: 1px solid var(--line);
    color: inherit;
    font: inherit;
    text-align: left;
    width: 100%;
  }
  .hero { border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06); cursor: pointer; }
  .kicker { margin: 0; color: var(--muted); font-size: 13px; }
  .name { margin: 4px 0 0; font-size: 20px; font-weight: 600; }
  .count { margin: 12px 0 0; font-size: 56px; line-height: 1; font-weight: 600; color: var(--action); }
  .unit { margin: 2px 0 0; color: var(--muted); font-size: 16px; }
  .when { margin: 12px 0 0; font-size: 14px; }
  .remain { margin: 2px 0 0; font-size: 14px; color: var(--action); }
  .lead { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .cheer {
    position: absolute; inset: 0; z-index: 4; border: 0; padding: 0; margin: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(16, 24, 43, 0.85); color: white; font: inherit; cursor: pointer;
  }
  .cheer canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cheer div { position: relative; text-align: center; padding: 0 24px; opacity: 0; }
  .cheer p { margin: 0; letter-spacing: 0.14em; text-transform: uppercase; font-size: 13px; font-weight: 600; color: #fbbf24; }
  .cheer b { display: block; margin-top: 8px; font-size: 28px; }
  .cheer span { display: block; margin-top: 4px; font-size: 18px; color: #93c5fd; }
  .section { margin: 20px 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .row-card {
    display: flex; align-items: center; gap: 16px; min-height: 56px;
    border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; cursor: pointer;
  }
  .row-num { font-size: 20px; font-weight: 600; min-width: 72px; }
  .row-num small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .row-name { font-size: 16px; }
  .row-date { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .grow { flex: 1; }
  .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .empty h3 { margin: 0 0 8px; font-size: 20px; }
  .empty p { margin: 0; color: var(--muted); line-height: 1.45; }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 48px;
    margin-top: 16px; border: 0; border-radius: 12px; background: var(--button); color: white;
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--delete); border: 1px solid var(--delete); margin-top: 8px; }
  .field { margin-top: 8px; border: 1px solid #94a3b8; border-radius: 8px; min-height: 56px; padding: 8px 16px; position: relative; display: flex; align-items: center; }
  .field span { position: absolute; top: -8px; left: 12px; background: var(--bg); padding: 0 4px; font-size: 12px; color: var(--muted); }
  .field input { width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; outline: none; }
  .date-row { display: flex; align-items: center; min-height: 56px; margin-top: 12px; padding: 0 16px; border-radius: 12px; cursor: pointer; }
  .date-row small { display: block; color: var(--muted); font-size: 13px; }
  .setrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
  .setrow > div { flex: 1; }
  .setrow b { font-weight: 600; }
  .setrow small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .setrow .value { color: var(--action); font-weight: 600; }
  .switch { width: 52px; height: 32px; border-radius: 16px; background: var(--track); border: 0; padding: 0; position: relative; flex: none; cursor: pointer; }
  .switch::after { content: ""; position: absolute; width: 24px; height: 24px; border-radius: 12px; background: white; top: 4px; left: 4px; }
  .switch.on { background: var(--button); }
  .switch.on::after { left: 24px; }
  .about { padding: 20px 8px 16px; text-align: center; }
  .about .mark { width: 64px; height: 64px; margin: 0 auto; border-radius: 16px; background: #F8FAFC; object-fit: contain; display: block; }
  .about b { display: block; margin-top: 12px; font-size: 20px; }
  .about .ver { margin-top: 2px; color: var(--muted); font-size: 13px; }
  .about p { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .about .hair { margin-top: 16px; }
  .about .copy { margin-top: 12px; font-size: 12px; }
  .cycle { display: flex; align-items: center; gap: 8px; min-height: 56px; user-select: none; }
  .cycle > div { flex: 1; }
  .cycle small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .cycle.past b { color: var(--muted); }
  .passed { flex: none; padding: 3px 8px; border-radius: 99px; background: var(--line); color: var(--muted); font-size: 12px; font-weight: 600; }
  .add-cycle { display: flex; gap: 8px; align-items: center; padding: 8px 0 12px; }
  .add-cycle input { flex: 1; height: 48px; border: 1px solid #94a3b8; border-radius: 8px; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding: 0 12px; }
  .add-btn { height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--button); color: white; font: inherit; font-weight: 600; cursor: pointer; }
  .shade { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .dialog { width: 100%; background: var(--card); color: var(--ink); border-radius: 28px; padding: 24px; }
  .dialog h3 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  .dialog p { margin: 0; }
  .dialog input { width: 100%; height: 48px; margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; padding: 0 12px; }
  .actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 8px; }
  .actions button { min-height: 48px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--action); cursor: pointer; }
  .actions .danger { color: var(--delete); }
</style>

  if (act === "setup") screen = "setup";
  if (act === "pick-lang") dialog = "lang";
  if (act === "lang") { lang = button.dataset.id; dialog = null; }
  if (act === "theme") theme = theme === "dark" ? "light" : "dark";
  if (act === "back") { dialog = null; screen = screen === "edit" ? editReturn : screen === "events" ? "setup" : "list"; }
  if (act === "events") screen = "events";
  if (act === "more-upcoming") allUpcoming = !allUpcoming;
  if (act === "more-together") allTogether = !allTogether;
  if (act === "add") { editReturn = screen; draft = { id: null, name: "", start: iso(today), cycles: defaultCycles(), extra: "" }; screen = "edit"; }
  if (act === "edit") {
    editReturn = screen;
    const eventRow = events.find(item => String(item.id) === button.dataset.id);
    draft = { id: eventRow.id, name: eventRow.name, start: eventRow.start, cycles: (eventRow.cycles || defaultCycles()).map(cycle => ({ ...cycle })), extra: "" };
    screen = "edit";
  }
  if (act === "cycle") {
    const days = Number(button.dataset.id);
    draft.cycles = draft.cycles.map(cycle => cycle.days === days ? { ...cycle, on: !cycle.on } : cycle);
  }
  if (act === "confirm-delete-list") {
    events = events.filter(item => String(item.id) !== String(dropEvent));
    dropEvent = null;
    dialog = null;
  }
  if (act === "confirm-drop") {
    draft.cycles = draft.cycles.filter(cycle => cycle.days !== draft.dropDays);
    dialog = null;
  }
  if (act === "add-cycle") {
    const days = Number(document.getElementById("cycle-days").value);
    if (Number.isInteger(days) && days >= 1 && days <= 100000 && !draft.cycles.some(cycle => cycle.days === days)) {
      draft.cycles = draft.cycles.concat({ days, on: true }).sort((a, b) => a.days - b.days);
      draft.extra = "";
    }
  }
  if (act === "save" && draft.name.trim()) {
    const name = draft.name.trim();
    const cycles = draft.cycles.map(cycle => ({ ...cycle }));
    if (draft.id == null) events.push({ id: Date.now(), name, start: draft.start, cycles });
    else Object.assign(events.find(item => item.id === draft.id), { name, start: draft.start, cycles });
    screen = editReturn;
  }
  if (act === "ask-delete") dialog = "delete";
  if (act === "close") dialog = null;
  if (act === "confirm-delete") { events = events.filter(item => item.id !== draft.id); dialog = null; screen = editReturn; }
  if (act === "pick-date") dialog = "date";
  if (act === "use-date") { const value = document.getElementById("picked-date").value; if (value) draft.start = value; dialog = null; }
  if (act === "pick-early") dialog = "early";
  if (act === "early") { early = Number(button.dataset.id); dialog = null; }
  if (act === "pick-time") dialog = "time";
  if (act === "use-time") {
    const value = document.getElementById("picked-time").value;
    if (value) { const [h, m] = value.split(":").map(Number); hour = h; minute = m; }
    dialog = null;
  }
  if (act === "flag") flags[button.dataset.id] = !flags[button.dataset.id];
  const scrollTop = document.querySelector(".event-list")?.scrollTop;
  render();
  if (act.startsWith("more-") && scrollTop != null) document.querySelector(".event-list").scrollTop = scrollTop;
});
document.getElementById("demo-fireworks").addEventListener("click", () => { cheerGen++; demoCheer = true; screen = "list"; dialog = null; render(); });
render();
</script>
